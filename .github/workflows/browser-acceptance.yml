name: Public browser acceptance
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: public-browser-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser-acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Validate source and full asset tree
        run: npm test && npm run check && node scripts/site-integrity.cjs
      - name: Install pinned test-only dependencies
        working-directory: test/browser
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Install Chromium and WebKit
        working-directory: test/browser
        run: npx --no-install playwright install --with-deps chromium webkit
      - name: Verify public browser journeys
        working-directory: test/browser
        run: npm test
      - name: Retain evidence for review
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: public-browser-evidence-${{ github.sha }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            test/browser/playwright-report/
            test/browser/test-results/
            test/browser/browser-results.json
            test/browser/package-lock.json
