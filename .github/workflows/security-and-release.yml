name: security-and-release

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-and-release:
    name: security-and-release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout reviewed source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Use Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: ''
      - name: Verify security unit tests
        run: npm test
      - name: Verify static public release gates
        run: npm run check
      - name: Reject incorrect customer AI availability claims
        run: |
          node - <<'NODE'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const m = fs.readFileSync('public/markets/index.html', 'utf8');
          const k = fs.readFileSync('public/knowledge/index.html', 'utf8');
          assert.doesNotMatch(m, /Use the live engine today|general modes available now/i);
          assert.match(m, /AI responses are paused pending release checks/i);
          assert.match(k, /Interactive AI responses are paused pending release checks/i);
          const manifest = JSON.parse(fs.readFileSync('public/release-manifest.json', 'utf8'));
          assert.equal(manifest.liveEngineAccess, 'requires-all-verified-release-gates');
          assert.equal(manifest.filmPublicPlayback, false);
          console.log('PUBLIC_AVAILABILITY_CLAIMS_PASS');
          NODE
