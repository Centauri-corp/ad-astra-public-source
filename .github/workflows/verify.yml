name: Verify AD ASTRA source
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  security-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: npm test
      - run: npm run check
# All inherited source, commercial and release checks are retained.
# Browser acceptance remains a separate complete Chromium and WebKit workflow.
# No production credentials, automatic deployment or approval bypass here.
