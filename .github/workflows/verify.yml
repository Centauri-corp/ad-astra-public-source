name: Verify AD ASTRA source
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  security-and-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
      - name: Verify all public customer, billing, recovery and website contracts
        run: npm test
      - name: Check release boundary and route configuration
        run: npm run check
# Production remains manual: stage on the exact team/project, run real Redis
# acceptance during the Vercel build, verify the deployment, then promote.
# Do not add deployment credentials until repository protections are configured.
