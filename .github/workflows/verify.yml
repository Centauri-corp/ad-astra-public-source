name: Verify AD ASTRA source
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  security-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.22.1'
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - run: npm test
  workspace-preview:
    name: Isolated workspace types, contracts, build and browser QA
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    defaults:
      run:
        working-directory: apps/customer-workspace
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.22.1'
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npm run test:runtime
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
# Production remains manual: stage on the exact team/project, run real Redis
# acceptance during the Vercel build, verify the deployment, then promote.
# Do not add deployment credentials until repository protections are configured.
