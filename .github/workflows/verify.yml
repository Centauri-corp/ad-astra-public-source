name: Verify AD ASTRA source
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  security-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - run: node --test test/security.test.cjs test/governance.test.js test/backend-foundation.test.cjs test/frontend-experience.test.cjs test/intelligence-catalog.test.cjs
      - run: node scripts/check-release.cjs
# Production remains manual: stage on exact team/project, run real Redis
# acceptance during the Vercel build, verify deployment, then promote.
# No production credential in this workflow.
