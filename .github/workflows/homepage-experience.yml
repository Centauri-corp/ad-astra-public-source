name: Homepage customer experience acceptance
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  homepage-experience:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Verify homepage product and neural contracts
        run: node --test test/homepage-experience.test.cjs
      - name: Install pinned browser test dependencies
        working-directory: test/browser
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install Chromium and WebKit
        working-directory: test/browser
        run: npx playwright install --with-deps chromium webkit
      - name: Verify product-led homepage journeys
        working-directory: test/browser
        run: npx playwright test homepage-experience.spec.cjs graphics-promotion.spec.cjs site-surface-audit.spec.cjs
      - name: Retain homepage evidence for review
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: homepage-experience-browser-evidence
          path: |
            test/browser/browser-results.json
            test/browser/playwright-report
            test/browser/test-results
          if-no-files-found: ignore
          retention-days: 7
