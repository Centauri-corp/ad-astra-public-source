name: Cinematic graphics preview verification
on:
  pull_request:
    branches: [main]
    paths:
      - "public/**"
      - "lib/graphics-intelligence-core.cjs"
      - "test/**"
      - ".github/workflows/cinematic-graphics-preview-check.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Inspect Node runtime
        run: node --version
      - name: Validate unified graphics and route contracts
        run: node --test test/graphics-intelligence-core.test.cjs test/consolidated-graphics-journey.test.cjs test/universal-stage-webgl.test.cjs test/single-public-journey.test.cjs
      - name: Validate public release safety contract
        run: node scripts/check-release.cjs
